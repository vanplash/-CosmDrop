<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmDrop — Bombzh Edition (Pixel & Shop)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #06070b;
            color: #e2e8f0; 
            font-family: 'Rajdhani', sans-serif; 
            margin: 0; 
            padding-bottom: 60px;
            min-height: 100vh;
        }

        .sh-font { font-family: 'Orbitron', sans-serif; letter-spacing: 0.05em; text-transform: uppercase; }

        /* LIVE TICKER */
        .live-ticker {
            background: #040508;
            border-bottom: 1px solid #1a1d2e;
            padding: 8px 20px;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            white-space: nowrap;
            min-height: 40px;
            align-items: center;
        }
        .live-card {
            background: #0d101d;
            border: 1px solid #22273d;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* NAVBAR */
        .navbar {
            background: #090c17;
            border-bottom: 2px solid #1a1d2e;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-menu {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .nav-link {
            color: #94a3b8;
            background: #0d101d;
            border: 1px solid #1f243b;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 13px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .nav-link:hover, .nav-link.active {
            color: #fff;
            background: #171d33;
            border-color: #3b82f6;
        }

        /* BOXES */
        .glass-box {
            background: #0d101d;
            border: 1px solid #1f243b;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        /* BUTTONS */
        .sh-btn {
            background: #f59e0b;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            transition: 0.2s;
        }
        .sh-btn:hover { background: #d97706; transform: translateY(-1px); }

        .steam-btn {
            background: #171a21;
            border: 1px solid #66c0f4;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-family: 'Orbitron', sans-serif;
            text-decoration: none;
        }

        .telegram-btn {
            width: 38px; height: 38px;
            background: #0ea5e9;
            border-radius: 50%;
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; text-decoration: none; font-size: 16px;
        }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .hidden { display: none !important; }
        
        input, select { background: #040508; color: #fff; border: 1px solid #1f243b; padding: 9px 12px; border-radius: 8px; outline: none; font-family: 'Rajdhani'; font-weight: 700; font-size: 13px; }
        input:focus, select:focus { border-color: #f59e0b; }

        /* КАРТКА КЕЙСУ БОМЖЕНЯ */
        .case-card {
            background: #0d101d;
            border: 2px solid #22273d;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 280px;
            margin: 0 auto;
        }
        .case-card:hover {
            transform: translateY(-6px);
            border-color: #f59e0b;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.2);
        }

        .case-art-box {
            width: 220px;
            height: 220px;
            background: #040508;
            border: 2px solid #3b82f6;
            border-radius: 12px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }
        .case-art-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* ПІКСЕЛЬНИЙ ЕФЕКТ ДЛЯ ЗОБРАЖЕННЯ КЕЙСУ */
            image-rendering: pixelated;
        }

        /* ОБВОДКИ ДЛЯ ЕФЕКТІВ ПРЕДМЕТІВ В КЕЙСІ */
        .case-item-card {
            background: #0d101d;
            border: 2px solid #1f243b;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            transition: 0.2s;
        }
        .case-item-card:hover {
            border-color: #3b82f6;
            transform: translateY(-3px);
        }

        /* ROULETTE */
        .roulette-wrapper {
            width: 100%; max-width: 620px; height: 110px;
            background: #040508; border: 2px solid #1f243b; border-radius: 12px;
            position: relative; overflow: hidden; margin: 20px auto;
        }
        .roulette-pointer {
            position: absolute; top: 0; bottom: 0; left: 50%;
            width: 4px; background: #f59e0b; transform: translateX(-50%); z-index: 10;
        }
        .roulette-track {
            display: flex; position: absolute; left: 0; top: 10px; height: 90px;
            transition: transform 5s cubic-bezier(0.1, 1, 0.1, 1);
        }
        .roulette-item {
            width: 90px; height: 90px; background: #0d101d; border: 1px solid #1f243b;
            border-radius: 8px; margin: 0 5px; flex-shrink: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5px; font-size: 10px; text-align: center;
        }

        .slot-box {
            width: 130px; height: 130px; background: #040508; border: 2px solid #1f243b;
            border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto;
        }

        .mc-card {
            background: #090c17; border: 1px solid #1f243b; border-radius: 10px; padding: 12px;
            cursor: pointer; text-align: center; transition: 0.2s;
        }
        .mc-card:hover, .mc-card.selected { border-color: #f59e0b; background: #131728; }

        /* SHOP ITEM CARD */
        .shop-item-card {
            background: #0d101d;
            border: 1px solid #1f243b;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .shop-item-card:hover {
            border-color: #f59e0b;
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.2);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="live-ticker" id="liveTicker"></div>

                    <i class="fa-solid fa-meteor"></i>
