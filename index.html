<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmDrop — Cosmic Drop Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #05050d url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1600&auto=format&fit=crop') center/cover fixed; 
            color: #e2e8f0; 
            font-family: 'Rajdhani', sans-serif; 
            user-select: none; 
            margin: 0; 
            padding-bottom: 50px;
            min-height: 100vh;
        }

        /* Футуристичні шрифти */
        .cosmo-head { font-family: 'Orbitron', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; }

        /* Ефект скла та неону (Glassmorphism) */
        .glass-card { 
            background: rgba(13, 14, 28, 0.75); 
            border: 1px solid rgba(139, 92, 246, 0.3); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 15px rgba(139, 92, 246, 0.15); 
            border-radius: 20px; 
            padding: 24px; 
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            border-color: rgba(6, 182, 212, 0.6);
            box-shadow: 0 10px 40px rgba(6, 182, 212, 0.25);
            transform: translateY(-4px);
        }

        button, input { cursor: pointer !important; pointer-events: auto !important; }

        /* Космічна неон-кнопка */
        .cosmo-btn { 
            background: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%); 
            color: #ffffff; 
            font-weight: 700; 
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); 
            transition: all 0.25s ease;
            width: 100%;
        }
        .cosmo-btn:hover:not(:disabled) { 
            background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 100%); 
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.7); 
            transform: scale(1.02);
        }

        /* Горизонтальна космічна рулетка */
        .case-roulette-container { 
            overflow: hidden; 
            position: relative; 
            width: 100%; 
            height: 130px; 
            background: rgba(5, 5, 15, 0.9); 
            border-radius: 16px; 
            border: 2px solid #8b5cf6; 
            margin: 20px 0; 
            box-shadow: inset 0 0 20px rgba(139, 92, 246, 0.3);
        }
        .case-roulette-track { display: flex; position: absolute; left: 0; top: 12px; height: 100px; transition: transform 4.5s cubic-bezier(0.1, 1, 0.1, 1); }
        .case-item-card { 
            width: 105px; 
            height: 100px; 
            flex-shrink: 0; 
            background: rgba(20, 20, 40, 0.8); 
            border: 1px solid rgba(139, 92, 246, 0.3); 
            margin: 0 5px; 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 6px; 
        }
        .case-marker { 
            position: absolute; 
            left: 50%; 
            top: 0; 
            bottom: 0; 
            width: 3px; 
            background: #06b6d4; 
            transform: translateX(-50%); 
            z-index: 20; 
            box-shadow: 0 0 15px #06b6d4, 0 0 30px #06b6d4; 
        }

        .modal { position: fixed; inset: 0; background: rgba(3, 3, 10, 0.85); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .hidden { display: none !important; }
    </style>
</head>

                    <i class="fa-solid fa-planet-moon"></i>
