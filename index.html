<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmDrop — Cosmic Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; }
        body { 
            background: #05050d; 
            color: #e2e8f0; 
            font-family: 'Rajdhani', sans-serif; 
            margin: 0; 
            padding-bottom: 50px;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 30%, #1a103c 0%, #05050d 70%);
        }

        .cosmo-head { font-family: 'Orbitron', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; }

        .glass-card { 
            background: rgba(13, 14, 28, 0.9); 
            border: 1px solid rgba(139, 92, 246, 0.4); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7), 0 0 20px rgba(139, 92, 246, 0.2); 
            border-radius: 20px; 
            padding: 20px; 
            backdrop-filter: blur(12px);
        }

        button, input, .clickable { 
            cursor: pointer !important; 
            pointer-events: auto !important; 
            position: relative;
            z-index: 10;
        }

        .cosmo-btn {

            border: none;
            padding: 14px 20px;

            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); 
            transition: all 0.25s ease;
            width: 100%;
        }
